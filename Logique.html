absolute;top:2px;left:calc(50% + 6px)}}@media(max-width:560px){.truth th{padding:8px 6px;font-size:.92rem}.truth th .f{white-space:normal}.truth th.atom,.truth td.atom{padding:8px}.cell{min-width:44px;height:42px}.proof:not(.proof-static) .pl{display:grid;grid-template-columns:22px auto minmax(0,1fr) 22px;grid-template-areas:"num bars f status" ". bars just just";column-gap:6px;row-gap:4px;padding:4px 0}.proof:not(.proof-static) .pl-num{grid-area:num}.proof:not(.proof-static) .pl-bars{grid-area:bars}.proof:not(.proof-static) .pl-f{grid-area:f}.proof:not(.proof-static) .pl-just{grid-area:just;margin-left:0}.proof:not(.proof-static) .pl-status{grid-area:status}.proof:not(.proof-static) .pl.fixed .pl-just{justify-self:start}.pl-rule{width:84px}.pl-cites{width:96px}.pl-msg{padding:0 8px 6px 34px}.proof-tools{display:grid;grid-template-columns:repeat(3,1fr)}.proof-tools .btn{width:100%;padding-left:4px;padding-right:4px}.bm-row{flex-direction:column;align-items:flex-start;gap:6px}.bm-label{min-width:0}.bm-status li{flex-wrap:wrap}.bm-want{flex-basis:100%;margin-left:30px}.kripke-graph{max-width:300px}.chip{height:40px;min-width:44px}.keys{gap:6px}.key{min-width:44px;height:46px;flex:1 0 44px}.key-wide{margin-left:0}.mt-row{font-size:1.05rem}.model-card{font-size:.95rem}}@media(hover:none){.choice:hover:not(:disabled){border-color:var(--line)}.choice.selected:hover:not(:disabled){border-color:var(--accent)}.node:not(:disabled):hover{transform:none}.key:hover:not(:disabled),.cell:hover:not(:disabled),.btn-ghost:hover:not(:disabled){background:var(--surface)}.cell.bad:hover{background:var(--bad-bg)}}@media(min-width:960px){.player:has(.ex-proof,.ex-buildmodel,.ex-kripkebuild) .footer-inner,.player:has(.ex-proof,.ex-buildmodel,.ex-kripkebuild) .player-top{max-width:1012px}}.toast{position:fixed;left:50%;transform:translate(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:14px;b     <div id="app"></div>
  <script>window.__LOGIQUE_CONTENT__ = {"index":{"modules":[{"id":"logique","title":"Logique formelle","description":"De la logique propositionnelle à la logique modale.","chapters":["ch0","ch1","ch2","ch3","ch4","ch5","ch6","ch7"]}]},"chapters":{"logique/ch0":{"id":"ch0","title":"Qu'est-ce qu'un argument ?","summary":"Prémisses, conclusion, validité : ce que la logique étudie.","lessons":[{"id":"l1","title":"Prémisses et conclusion","cours":[{"title":"Un argument","body":"En logique, un **argument** est une suite de phrases : les **prémisses**, puis une **conclusion** que les prémisses sont censées justifier.\n\nDes mots comme *donc*, *par conséquent*, *ainsi* annoncent la conclusion. Des mots comme *car*, *puisque*, *étant donné que* annoncent une prémisse.","examples":[{"text":"Il pleut. S'il pleut, la route est mouillée. Donc la route est mouillée.","note":"Deux prémisses, puis la conclusion après « donc »."},{"text":"Socrate est mortel, car tous les hommes sont mortels et Socrate est un homme.","note":"Ici la conclusion vient en premier ; « car » introduit les prémisses."}]},{"title":"Seules les phrases déclaratives comptent","body":"Prémisses et conclusion doivent pouvoir être **vraies ou fausses**. Une question (« Quelle heure est-il ? »), un ordre (« Ferme la porte ! ») ou une exclamation ne peuvent pas jouer ce rôle."}],"exercises":[{"id":"c0-1","type":"mcq","prompt":"« Il fait froid, puisque le lac a gelé. » Quelle est la conclusion ?","choices":["Il fait froid.","Le lac a gelé.","Il n'y a pas de conclusion."],"answer":0,"explanation":"« Puisque » introduit la prémisse (le lac a gelé) ; la conclusion est ce qu'elle justifie."},{"id":"c0-2","type":"mcq","prompt":"Laquelle de ces phrases peut servir de prémisse ?","choices":["Paris est la capitale de l'Italie.","Viens-tu ce soir ?","Range ta chambre !","Quelle belle journée !"],"answer":0,"explanation":"Elle est fausse, mais elle est vraie ou fausse : c'est tout ce qu'on demande à une prémisse."},{"id":"c0-3","type":"mcq","prompt":"Quel mot annonce en général une **conclusion** ?","choices":["donc","car","puisque","parce que"],"answer":0},{"id":"c0-4","type":"mcq","prompt":"« Tous les chats miaulent et Félix est un chat. Par conséquent, Félix miaule. » Combien de prémisses ?","choices":["Une","Deux","Trois"],"answer":1,"explanation":"« Tous les chats miaulent » et « Félix est un chat » ; « Félix miaule » est la conclusion."},{"id":"c0-5","type":"mcq","prompt":"« Ferme la fenêtre, il fait froid. » Est-ce un argument au sens logique ?","choices":["Non : « Ferme la fenêtre » n'est ni vrai ni faux.","Oui : « il fait froid » est la conclusion.","Oui : il y a deux phrases."],"answer":0,"explanation":"Un ordre ne peut pas être une conclusion : il n'a pas de valeur de vérité."},{"id":"c0-6","type":"mcq","prompt":"« Le train est en retard, étant donné que la voie est bloquée. » Quelle est la prémisse ?","choices":["La voie est bloquée.","Le train est en retard."],"answer":0}]},{"id":"l2","title":"Validité et vérité","cours":[{"title":"Un argument valide","body":"Un argument est **valide** s'il est *impossible* que toutes ses prémisses soient vraies et sa conclusion fausse.\n\nLa validité ne dit rien de la vérité des prémisses : elle garantit seulement que *si* les prémisses sont vraies, la conclusion l'est aussi.","examples":[{"text":"Tous les poissons volent. Le saumon est un poisson. Donc le saumon vole.","note":"Valide, alors que la première prémisse est fausse."},{"text":"Certains oiseaux nagent. Donc Paris est en France.","note":"Prémisse et conclusion vraies, mais invalide : la conclusion ne découle pas de la prémisse."}]},{"title":"Valide et correct ; la forme","body":"Un argument **correct** (on dit aussi *bien fondé*) est valide **et** a des prémisses vraies. Sa conclusion est alors forcément vraie.\n\nLa validité dépend de la **forme** de l'argument, pas de son sujet. « S'il pleut, la route est mouillée ; il pleut ; donc la route est mouillée » a la même forme que « Si p alors q ; p ; donc q ». C'est pourquoi on remplacera bientôt les phrases par des lettres."}],"exercises":[{"id":"c0-7","type":"mcq","prompt":"Un argument valide peut-il avoir une conclusion fausse ?","choices":["Oui, si au moins une prémisse est fausse.","Non, jamais.","Oui, même si toutes les prémisses sont vraies."],"answer":0,"explanation":"La validité interdit seulement le cas « prémisses toutes vraies, conclusion fausse »."},{"id":"c0-8","type":"mcq","prompt":"« Tous les chiens sont des chats. Tous les chats aboient. Donc tous les chiens aboient. » Cet argument est…","choices":["valide mais non correct","valide et correct","invalide"],"answer":0,"explanation":"Si les prémisses étaient vraies, la conclusion le serait forcément : il est valide. Mais ses prémisses sont fausses."},{"id":"c0-9","type":"mcq","prompt":"« Si je suis à Lyon, je suis en France. Je suis en France. Donc je suis à Lyon. » Cet argument est…","choices":["invalide","valide"],"answer":0,"explanation":"On peut être en France sans être à Lyon (à Brest, par exemple) : prémisses vraies, conclusion fausse. C'est le sophisme de l'affirmation du conséquent."},{"id":"c0-10","type":"mcq","prompt":"Quelle situation est **impossible** pour un argument valide ?","choices":["Prémisses vraies, conclusion fausse","Prémisses fausses, conclusion vraie","Prémisses fausses, conclusion fausse","Prémisses vraies, conclusion vraie"],"answer":0},{"id":"c0-11","type":"mcq","prompt":"Un argument correct (bien fondé) est un argument…","choices":["valide dont les prémisses sont vraies","dont la conclusion est vraie","valide, quelles que soient ses prémisses"],"answer":0},{"id":"c0-12","type":"mcq","prompt":"« Si le moteur tourne, il y a de l'essence. Le moteur tourne. Donc il y a de l'essence. » Quelle est sa forme ?","choices":["Si p alors q ; p ; donc q","Si p alors q ; q ; donc p","p ou q ; non p ; donc q"],"answer":0,"explanation":"C'est le *modus ponens*, la forme valide la plus utilisée."},{"id":"c0-13","type":"mcq","prompt":"La validité d'un argument dépend…","choices":["de sa forme","de la vérité de ses prémisses","du sujet dont il parle"],"answer":0}]}],"test":{"size":8}},"logique/ch1":{"id":"ch1","title":"Logique propositionnelle","summary":"Connecteurs, formalisation et tables de vérité.","symbols":["¬","∧","∨","→","↔","(",")"],"lessons":[{"id":"l1","title":"Négation et conjonction","cours":[{"title":"Des lettres pour les phrases","body":"On remplace chaque phrase simple par une **lettre de proposition** : `p`, `q`, `r`… Une phrase simple est soit vraie (**V**), soit fausse (**F**).\n\nOn construit ensuite des phrases complexes avec des **connecteurs**.","examples":[{"text":"p : « il pleut » ; q : « il fait froid »"}]},{"title":"La négation ¬","body":"`¬p` se lit « non p ». Elle est vraie quand `p` est fausse, et fausse quand `p` est vraie.\n\nEn français : « il ne pleut pas », « il est faux qu'il pleuve ».","examples":[{"formula":"¬p","note":"« Il ne pleut pas »"}]},{"title":"La conjonction ∧","body":"`p ∧ q` se lit « p et q ». Elle est vraie **seulement** quand `p` et `q` sont toutes les deux vraies.\n\n« Mais », « pourtant », « bien que », « et aussi » se formalisent aussi par ∧ : la nuance d'opposition n'a pas d'effet sur la vérité.","examples":[{"text":"Il pleut mais il ne fait pas froid.","formula":"p ∧ ¬q"}]}],"exercises":[{"id":"c1-1","type":"mcq","prompt":"Si `p` est vraie, que vaut `¬p` ?","choices":["Faux","Vrai","Ça dépend de q"],"answer":0},{"id":"c1-2","type":"mcq","prompt":"`p` est vraie et `q` est fausse. Que vaut `p ∧ q` ?","choices":["Faux","Vrai"],"answer":0,"explanation":"Une conjonction n'est vraie que si ses deux membres sont vrais."},{"id":"c1-3","type":"formalize","sentence":"Il pleut et il fait froid.","legend":{"p":"il pleut","q":"il fait froid"},"answer":"p ∧ q"},{"id":"c1-4","type":"formalize","sentence":"Il ne pleut pas.","legend":{"p":"il pleut"},"answer":"¬p"},{"id":"c1-5","type":"formalize","sentence":"Marie est venue, mais Paul n'est pas venu.","legend":{"m":"Marie est venue","p":"Paul est venu"},"answer":"m ∧ ¬p","explanation":"« Mais » se formalise par ∧."},{"id":"c1-6","type":"truthtable","formula":"p ∧ q"},{"id":"c1-7","type":"mcq","prompt":"Que vaut `¬¬p` quand `p` est fausse ?","choices":["Faux","Vrai"],"answer":0,"explanation":"Deux négations s'annulent : ¬¬p a toujours la même valeur que p."},{"id":"c1-8","type":"formalize","sentence":"Il ne pleut pas et il ne fait pas froid.","legend":{"p":"il pleut","q":"il fait froid"},"answer":"¬p ∧ ¬q"}]},{"id":"l2","title":"Disjonction et implication","cours":[{"title":"La disjonction ∨","body":"`p ∨ q` se lit « p ou q ». Elle est vraie quand **au moins une** des deux est vraie, y compris quand les deux le sont : c'est le *ou inclusif*.\n\nLe *ou exclusif* (« soit… soit… », « fromage ou dessert ») s'écrit `(p ∨ q) ∧ ¬(p ∧ q)`.","examples":[{"text":"Je prends le bus ou le métro.","formula":"b ∨ m"}]},{"title":"L'implication →","body":"`p → q` se lit « si p, alors q ». `p` est l'**antécédent**, `q` le **conséquent**.\n\nElle n'est fausse que dans un cas : `p` vraie et `q` fausse. Quand `p` est fausse, l'implication est vraie : la promesse « s'il pleut, je prends mon parapluie » n'est pas trahie un jour sans pluie."},{"title":"Les pièges du français","body":"- « q **si** p » : `p → q`\n- « p **seulement si** q » : `p → q`\n- « p est une condition **suffisante** pour q » : `p → q`\n- « p est une condition **nécessaire** pour q » : `q → p`\n- « p **à moins que** q » : `¬q → p`, équivalent à `p ∨ q`","examples":[{"text":"Tu réussiras seulement si tu travailles.","formula":"r → t","note":"Réussir exige de travailler : si tu réussis, c'est que tu as travaillé."}]}],"exercises":[{"id":"c1-9","type":"mcq","prompt":"`p` et `q` sont vraies. Que vaut `p ∨ q` ?","choices":["Vrai","Faux"],"answer":0,"explanation":"Le ∨ de la logique est inclusif."},{"id":"c1-10","type":"mcq","prompt":"Dans quel cas `p → q` est-elle fausse ?","choices":["p vraie et q fausse","p fausse et q vraie","p et q fausses","Jamais"],"answer":0},{"id":"c1-11","type":"formalize","sentence":"S'il pleut, la route est mouillée.","legend":{"p":"il pleut","m":"la route est mouillée"},"answer":"p → m"},{"id":"c1-12","type":"formalize","sentence":"Tu auras ton diplôme seulement si tu passes l'examen.","legend":{"d":"tu auras ton diplôme","e":"tu passes l'examen"},"answer":"d → e","explanation":"« p seulement si q » se formalise p → q : avoir le diplôme exige l'examen."},{"id":"c1-13","type":"truthtable","formula":"p → q"},{"id":"c1-14","type":"formalize","sentence":"La plante mourra si on ne l'arrose pas.","legend":{"m":"la plante mourra","a":"on arrose la plante"},"answer":"¬a → m","explanation":"« q si p » se formalise p → q : ici la condition est « on ne l'arrose pas »."},{"id":"c1-15","type":"formalize","sentence":"Nous sortirons, à moins qu'il ne pleuve.","legend":{"s":"nous sortirons","p":"il pleut"},"answer":"s ∨ p","explanation":"« p à moins que q » équivaut à ¬q → p, c'est-à-dire p ∨ q. Les deux écritures sont acceptées."},{"id":"c1-16","type":"mcq","prompt":"« Avoir 18 ans est une condition nécessaire pour voter. » Avec v : « on vote » et d : « on a 18 ans », cela donne :","choices":["v → d","d → v","v ∧ d"],"formulas":true,"answer":0,"explanation":"Une condition nécessaire est ce qu'implique la chose : si on vote, alors on a 18 ans."},{"id":"c1-17","type":"mcq","prompt":"`p` est fausse et `q` est fausse. Que vaut `p → q` ?","choices":["Vrai","Faux"],"answer":0,"explanation":"Antécédent faux : l'implication est vraie."}]},{"id":"l3","title":"Biconditionnel et parenthèses","cours":[{"title":"Le biconditionnel ↔","body":"`p ↔ q` se lit « p si et seulement si q ». Il est vrai quand `p` et `q` ont **la même valeur** (toutes deux vraies ou toutes deux fausses).\n\nIl équivaut à `(p → q) ∧ (q → p)`.","examples":[{"text":"Un nombre est pair si et seulement si il est divisible par 2.","formula":"p ↔ d"}]},{"title":"Parenthèses et connecteur principal","body":"Les parenthèses lèvent l'ambiguïté : `¬(p ∧ q)` (« pas les deux ») n'est pas `¬p ∧ q`.\n\nLe **connecteur principal** est celui qui s'applique en dernier, à la formule entière. Il en détermine la nature : `(p ∧ q) → r` est une implication, `p ∧ (q → r)` une conjonction.\n\nSans parenthèses, on lit ¬ avant ∧, ∧ avant ∨, ∨ avant →, → avant ↔."}],"exercises":[{"id":"c1-18","type":"mcq","prompt":"`p` est fausse et `q` est fausse. Que vaut `p ↔ q` ?","choices":["Vrai","Faux"],"answer":0,"explanation":"Même valeur des deux côtés : le biconditionnel est vrai."},{"id":"c1-19","type":"mcq","prompt":"Quel est le connecteur principal de `¬(p ∧ q) → r` ?","choices":["→","¬","∧"],"formulas":true,"answer":0},{"id":"c1-20","type":"mcq","prompt":"Quel est le connecteur principal de `¬(p ∨ q)` ?","choices":["¬","∨"],"formulas":true,"answer":0,"explanation":"La négation porte sur toute la parenthèse : elle s'applique en dernier."},{"id":"c1-21","type":"formalize","sentence":"Il est faux qu'il pleuve et qu'il fasse froid.","legend":{"p":"il pleut","q":"il fait froid"},"answer":"¬(p ∧ q)","explanation":"La négation porte sur la conjonction entière."},{"id":"c1-22","type":"formalize","sentence":"La lampe s'allume si et seulement si on appuie sur l'interrupteur.","legend":{"l":"la lampe s'allume","i":"on appuie sur l'interrupteur"},"answer":"l ↔ i"},{"id":"c1-23","type":"truthtable","formula":"p ↔ q"},{"id":"c1-24","type":"formalize","sentence":"Si Jean vient et que Marie ne vient pas, la fête sera ratée.","legend":{"j":"Jean vient","m":"Marie vient","f":"la fête sera ratée"},"answer":"(j ∧ ¬m) → f"},{"id":"c1-25","type":"mcq","prompt":"Que vaut `(p ∨ q) → r` si `p` est vraie, `q` fausse et `r` fausse ?","choices":["Faux","Vrai"],"answer":0,"explanation":"p ∨ q est vraie, r est fausse : l'implication est fausse."}]},{"id":"l4","title":"Tables de vérité","cours":[{"title":"Construire une table","body":"Une **table de vérité** donne la valeur d'une formule pour chaque **valuation**, c'est-à-dire chaque façon d'attribuer V ou F aux lettres.\n\nAvec *n* lettres, il y a 2ⁿ lignes : 4 lignes pour 2 lettres, 8 pour 3. On les écrit dans un ordre fixe : la première lettre change le plus lentement, et V vient avant F.\n\nOn calcule de l'intérieur vers l'extérieur : d'abord les sous-formules, puis le connecteur principal."},{"title":"Méthode, colonne par colonne","body":"Pour `¬p ∨ q` :\n- on calcule la colonne `¬p` en inversant `p` ;\n- puis la colonne `¬p ∨ q` : V dès qu'une des deux colonnes contient V.\n\nRésultat : F seulement à la ligne p = V, q = F. C'est la même colonne que `p → q`, nous y reviendrons."}],"exercises":[{"id":"c1-26","type":"mcq","prompt":"Combien de lignes compte la table de vérité d'une formule à 3 lettres ?","choices":["8","6","9","3"],"answer":0,"explanation":"2 × 2 × 2 = 8 valuations."},{"id":"c1-27","type":"truthtable","formula":"p ∨ q"},{"id":"c1-28","type":"truthtable","formula":"¬p ∨ q","columns":["¬p","¬p ∨ q"]},{"id":"c1-29","type":"truthtable","formula":"¬(p ∧ q)","columns":["p ∧ q","¬(p ∧ q)"]},{"id":"c1-30","type":"truthtable","formula":"(p → q) ∧ p","columns":["p → q","(p → q) ∧ p"]},{"id":"c1-31","type":"mcq","prompt":"Combien de lignes de la table de `p ∧ q ∧ r` sont vraies ?","choices":["1","3","4","7"],"answer":0,"explanation":"Une seule ligne : celle où les trois lettres sont vraies."},{"id":"c1-32","type":"truthtable","formula":"(p ∧ q) → r"}]},{"id":"l5","title":"Formaliser","cours":[{"title":"Méthode","body":"- Repère les **phrases simples** et donne à chacune une lettre (sans négation : « il pleut », pas « il ne pleut pas »).\n- Repère les **connecteurs** : *non*, *et*, *ou*, *si… alors*, *seulement si*, *si et seulement si*, *à moins que*, *ni… ni*.\n- Trouve le **connecteur principal** et place les parenthèses.\n\nUne formalisation est correcte si elle a les mêmes conditions de vérité que la phrase : l'application accepte toute formule **équivalente**.","examples":[{"text":"Ni Pierre ni Paul ne sont venus.","formula":"¬p ∧ ¬q","note":"ou, de manière équivalente, ¬(p ∨ q)"}]}],"exercises":[{"id":"c1-33","type":"formalize","sentence":"Ni Pierre ni Paul ne sont venus.","legend":{"p":"Pierre est venu","q":"Paul est venu"},"answer":"¬p ∧ ¬q"},{"id":"c1-34","type":"formalize","sentence":"Si tu ne te dépêches pas, tu rateras le train ou tu arriveras en retard.","legend":{"d":"tu te dépêches","t":"tu rateras le train","r":"tu arriveras en retard"},"answer":"¬d → (t ∨ r)"},{"id":"c1-35","type":"formalize","sentence":"Soit il pleut, soit il fait beau, mais pas les deux.","legend":{"p":"il pleut","b":"il fait beau"},"answer":"(p ∨ b) ∧ ¬(p ∧ b)","explanation":"C'est le « ou exclusif ». ¬(p ↔ b) est aussi accepté : c'est équivalent."},{"id":"c1-36","type":"formalize","sentence":"Le gâteau sera réussi seulement si le four est chaud et la pâte a levé.","legend":{"g":"le gâteau sera réussi","f":"le four est chaud","l":"la pâte a levé"},"answer":"g → (f ∧ l)"},{"id":"c1-37","type":"formalize","sentence":"Je viendrai si tu viens, et seulement si tu viens.","legend":{"j":"je viendrai","t":"tu viens"},"answer":"j ↔ t"},{"id":"c1-38","type":"mcq","prompt":"« Il n'est pas vrai que, s'il pleut, il fait froid. » Quelle formalisation est correcte (p : il pleut, q : il fait froid) ?","choices":["¬(p → q)","¬p → q","p → ¬q"],"formulas":true,"answer":0,"explanation":"La négation porte sur toute l'implication."},{"id":"c1-39","type":"formalize","sentence":"Si Anne ou Bruno viennent, Claire viendra aussi.","legend":{"a":"Anne vient","b":"Bruno vient","c":"Claire vient"},"answer":"(a ∨ b) → c"},{"id":"c1-40","type":"formula","prompt":"Écris le « ou exclusif » de `p` et `q` : vrai quand une seule des deux est vraie.","answer":"(p ∨ q) ∧ ¬(p ∧ q)"}]}],"test":{"size":10,"exercises":[{"id":"c1-t1","type":"formalize","sentence":"Si le café est froid, je ne le bois pas, à moins qu'il soit sucré.","legend":{"f":"le café est froid","b":"je bois le café","s":"le café est sucré"},"answer":"f → (¬b ∨ s)","explanation":"« Je ne le bois pas, à moins qu'il soit sucré » donne ¬b ∨ s ; la condition f porte sur l'ensemble."},{"id":"c1-t2","type":"truthtable","formula":"(p ∨ q) → ¬p","columns":["p ∨ q","¬p","(p ∨ q) → ¬p"]}]}},"logique/ch2":{"id":"ch2","title":"Tautologies et équivalences","summary":"Formules toujours vraies, formules équivalentes, validité par les tables.","symbols":["¬","∧","∨","→","↔","(",")"],"lessons":[{"id":"l1","title":"Tautologie, contradiction, contingence","cours":[{"title":"Trois statuts","body":"- Une **tautologie** est vraie pour toutes les valuations : sa colonne ne contient que des V. Exemple : `p ∨ ¬p` (tiers exclu).\n- Une **contradiction** est fausse pour toutes les valuations. Exemple : `p ∧ ¬p`.\n- Une formule **contingente** est vraie pour certaines valuations et fausse pour d'autres. Exemple : `p → q`.\n\nUne formule est **satisfiable** si elle est vraie pour au moins une valuation : toutes sauf les contradictions."},{"title":"Le test","body":"Pour classer une formule, on dresse sa table et on regarde la dernière colonne : que des V, que des F, ou un mélange.\n\nUne formule est une tautologie si et seulement si sa négation est une contradiction.","examples":[{"formula":"p → (q → p)","note":"Tautologie : pour la rendre fausse il faudrait p vraie et q → p fausse, donc p fausse. Impossible."}]}],"exercises":[{"id":"c2-1","type":"mcq","prompt":"`p ∨ ¬p` est…","choices":["une tautologie","une contradiction","contingente"],"answer":0,"explanation":"C'est le principe du tiers exclu."},{"id":"c2-2","type":"mcq","prompt":"`p ∧ ¬p` est…","choices":["une contradiction","une tautologie","contingente"],"answer":0,"explanation":"C'est le principe de non-contradiction : p et ¬p ne peuvent être vraies ensemble."},{"id":"c2-3","type":"truthtable","prompt":"Complète la table pour savoir si `(p ∧ q) → p` est une tautologie.","formula":"(p ∧ q) → p","columns":["p ∧ q","(p ∧ q) → p"]},{"id":"c2-4","type":"mcq","prompt":"`(p ∧ q) → p` est…","choices":["une tautologie","une contradiction","contingente"],"answer":0},{"id":"c2-5","type":"mcq","prompt":"`p → ¬p` est…","choices":["contingente","une contradiction","une tautologie"],"answer":0,"explanation":"Vraie quand p est fausse, fausse quand p est vraie."},{"id":"c2-6","type":"mcq","prompt":"Si `A` est une tautologie, alors `¬A` est…","choices":["une contradiction","une tautologie","contingente"],"answer":0},{"id":"c2-7","type":"truthtable","formula":"(p → q) ∨ (q → p)","columns":["p → q","q → p","(p → q) ∨ (q → p)"]},{"id":"c2-8","type":"formula","prompt":"Écris une tautologie qui utilise la lettre `p` et le connecteur →.","answer":"p → p","require":["→"],"explanation":"p → p, ¬p → ¬p ou p → (p ∨ p) conviennent : toute tautologie est équivalente à toute autre."}]},{"id":"l2","title":"De Morgan et double négation","cours":[{"title":"Équivalence logique","body":"Deux formules sont **équivalentes** (on note `A ≡ B`) si elles ont la même valeur pour toutes les valuations : leurs colonnes sont identiques.\n\nAutre manière de le dire : `A ≡ B` exactement quand `A ↔ B` est une tautologie."},{"title":"Les lois de De Morgan","body":"- `¬(p ∧ q) ≡ ¬p ∨ ¬q` : « pas les deux » revient à « l'un des deux est faux ».\n- `¬(p ∨ q) ≡ ¬p ∧ ¬q` : « ni l'un ni l'autre ».\n\nLa négation traverse la parenthèse en changeant ∧ en ∨ et inversement.\n\n**Double négation** : `¬¬p ≡ p`.","examples":[{"text":"« Il est faux que Jean et Marie soient venus » = « Jean n'est pas venu ou Marie n'est pas venue »."}]}],"exercises":[{"id":"c2-9","type":"mcq","prompt":"Quelle formule est équivalente à `¬(p ∧ q)` ?","choices":["¬p ∨ ¬q","¬p ∧ ¬q","¬p ∧ q","p ∨ q"],"formulas":true,"answer":0},{"id":"c2-10","type":"formula","prompt":"Réécris `¬(p ∨ q)` sans ∨ et sans négation devant une parenthèse.","answer":"¬p ∧ ¬q","forbid":["∨"],"negationOnAtoms":true},{"id":"c2-11","type":"formula","prompt":"Réécris `¬(p ∧ ¬q)` en n'utilisant ni ∧ ni →.","answer":"¬p ∨ q","forbid":["∧","→"],"negationOnAtoms":true,"explanation":"De Morgan donne ¬p ∨ ¬¬q, puis la double négation ¬p ∨ q."},{"id":"c2-12","type":"mcq","prompt":"« Il est faux que Léa parle anglais ou allemand. » Cela signifie :","choices":["Léa ne parle ni anglais ni allemand.","Léa ne parle pas l'une des deux langues.","Léa parle une seule des deux langues."],"answer":0},{"id":"c2-13","type":"truthtable","prompt":"Vérifie De Morgan : remplis les deux colonnes et compare-les.","formula":"¬(p ∨ q)","columns":["¬(p ∨ q)","¬p ∧ ¬q"]},{"id":"c2-14","type":"formula","prompt":"Simplifie `¬¬(p ∧ ¬¬q)` : écris une formule équivalente sans aucune négation.","answer":"p ∧ q","forbid":["¬"]},{"id":"c2-15","type":"mcq","prompt":"Quelle formule n'est **pas** équivalente à `¬(¬p ∨ q)` ?","choices":["¬p ∧ ¬q","p ∧ ¬q","¬(p → q)"],"formulas":true,"answer":0,"explanation":"¬(¬p ∨ q) ≡ ¬¬p ∧ ¬q ≡ p ∧ ¬q, qui est aussi ¬(p → q)."}]},{"id":"l3","title":"Implication, contraposée, distributivité","cours":[{"title":"Réécrire l'implication","body":"- `p → q ≡ ¬p ∨ q` : « si p alors q » revient à « non p, ou q ».\n- `¬(p → q) ≡ p ∧ ¬q` : une implication est fausse quand l'antécédent est vrai et le conséquent faux.\n- **Contraposée** : `p → q ≡ ¬q → ¬p`.\n\nAttention : la **réciproque** `q → p` et la **contraire** `¬p → ¬q` ne sont **pas** équivalentes à `p → q`.","examples":[{"text":"« S'il pleut, la route est mouillée » ≡ « si la route n'est pas mouillée, il ne pleut pas »."}]},{"title":"Distributivité et biconditionnel","body":"- `p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)`\n- `p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r)`\n- `p ↔ q ≡ (p → q) ∧ (q → p)`\n- **Exportation** : `(p ∧ q) → r ≡ p → (q → r)`"}],"exercises":[{"id":"c2-16","type":"mcq","prompt":"Quelle est la contraposée de `p → q` ?","choices":["¬q → ¬p","q → p","¬p → ¬q","¬p → q"],"formulas":true,"answer":0},{"id":"c2-17","type":"mcq","prompt":"« S'il est cuisinier, il sait faire une omelette. » Laquelle de ces phrases dit la même chose ?","choices":["S'il ne sait pas faire d'omelette, il n'est pas cuisinier.","S'il sait faire une omelette, il est cuisinier.","S'il n'est pas cuisinier, il ne sait pas faire d'omelette."],"answer":0,"explanation":"C'est la contraposée. Les deux autres sont la réciproque et la contraire."},{"id":"c2-18","type":"formula","prompt":"Réécris `p → q` avec seulement ¬ et ∨.","answer":"¬p ∨ q","forbid":["→","∧","↔"]},{"id":"c2-19","type":"formula","prompt":"Écris la négation de `p → q` sans utiliser →.","answer":"p ∧ ¬q","forbid":["→","↔"]},{"id":"c2-20","type":"formula","prompt":"Développe `p ∧ (q ∨ r)` en une disjonction de conjonctions.","answer":"(p ∧ q) ∨ (p ∧ r)"},{"id":"c2-21","type":"formula","prompt":"Écris une formule équivalente à `p ↔ q` sans utiliser ↔.","answer":"(p → q) ∧ (q → p)","forbid":["↔"]},{"id":"c2-22","type":"mcq","prompt":"`(p ∧ q) → r` est équivalente à…","choices":["p → (q → r)","(p → q) → r","p ∧ (q → r)"],"formulas":true,"answer":0,"explanation":"C'est la loi d'exportation."},{"id":"c2-23","type":"formula","prompt":"Écris `p ∨ q` en utilisant seulement ¬ et →.","answer":"¬p → q","forbid":["∨","∧","↔"],"explanation":"« p ou q » revient à « si non p, alors q »."}]},{"id":"l4","title":"Validité par les tables","cours":[{"title":"Tester un argument","body":"Un argument est **valide** si aucune valuation ne rend toutes les prémisses vraies et la conclusion fausse.\n\nUne valuation qui le fait est un **contre-exemple** : elle prouve que l'argument est invalide. Pour le trouver, cherche dans la table une ligne où les prémisses sont V et la conclusion F.","examples":[{"text":"p → q, q ∴ p","note":"Invalide : avec p = F et q = V, les prémisses sont vraies et la conclusion fausse."}]},{"title":"Formes à connaître","body":"Valides :\n- *modus ponens* : `p → q`, `p` ∴ `q`\n- *modus tollens* : `p → q`, `¬q` ∴ `¬p`\n- *syllogisme disjonctif* : `p ∨ q`, `¬p` ∴ `q`\n- *syllogisme hypothétique* : `p → q`, `q → r` ∴ `p → r`\n\nInvalides (sophismes) :\n- affirmation du conséquent : `p → q`, `q` ∴ `p`\n- négation de l'antécédent : `p → q`, `¬p` ∴ `¬q`"}],"exercises":[{"id":"c2-24","type":"valuation","premises":["p → q","q"],"conclusion":"p","explanation":"C'est l'affirmation du conséquent : p = F, q = V est un contre-exemple."},{"id":"c2-25","type":"valuation","premises":["p → q","¬p"],"conclusion":"¬q","explanation":"C'est la négation de l'antécédent : p = F, q = V est un contre-exemple."},{"id":"c2-26","type":"valuation","prompt":"Trouve un contre-exemple, ou indique que l'argument est valide.","premises":["p → q","¬q"],"conclusion":"¬p","explanation":"C'est le modus tollens : il est valide."},{"id":"c2-27","type":"mcq","prompt":"« Si le chien aboie, il y a quelqu'un. Il n'y a personne. Donc le chien n'aboie pas. » Quelle forme ?","choices":["Modus tollens (valide)","Modus ponens (valide)","Négation de l'antécédent (invalide)"],"answer":0},{"id":"c2-28","type":"valuation","prompt":"Trouve un contre-exemple, ou indique que l'argument est valide.","premises":["p ∨ q","p"],"conclusion":"¬q","explanation":"Le ∨ est inclusif : p et q peuvent être vraies ensemble."},{"id":"c2-29","type":"valuation","prompt":"Trouve un contre-exemple, ou indique que l'argument est valide.","premises":["p → q","q → r"],"conclusion":"p → r","explanation":"C'est le syllogisme hypothétique : valide."},{"id":"c2-30","type":"valuation","prompt":"Trouve un contre-exemple, ou indique que l'argument est valide.","premises":["p → (q ∨ r)","¬q"],"conclusion":"¬p","explanation":"Avec p = V, q = F, r = V, les prémisses sont vraies et la conclusion fausse."},{"id":"c2-31","type":"mcq","prompt":"« Soit il est à la maison, soit il est au bureau. Il n'est pas au bureau. Donc il est à la maison. » Cet argument est…","choices":["valide (syllogisme disjonctif)","invalide"],"answer":0}]}],"test":{"size":10,"exercises":[{"id":"c2-t1","type":"formula","prompt":"Écris la négation de `p ∧ (q → r)` sans négation devant une parenthèse, et sans utiliser →.","answer":"¬p ∨ (q ∧ ¬r)","forbid":["→","↔"],"negationOnAtoms":true},{"id":"c2-t2","type":"valuation","prompt":"Trouve un contre-exemple, ou indique que l'argument est valide.","premises":["(p ∧ q) → r","¬r"],"conclusion":"¬p","explanation":"Avec p = V, q = F, r = F : prémisses vraies, conclusion fausse."}]}},"logique/ch3":{"id":"ch3","title":"Déduction naturelle","summary":"Démontrer pas à pas, avec des règles d'introduction et d'élimination.","symbols":["¬","∧","∨","→","↔","⊥","(",")"],"lessons":[{"id":"l1","title":"Preuves de Fitch : ∧ et →E","cours":[{"title":"Une preuve, ligne par ligne","body":"Les tables de vérité deviennent vite énormes. La **déduction naturelle** montre qu'un argument est valide en avançant pas à pas.\n\nUne preuve est une suite de lignes numérotées. Chaque ligne contient une formule et sa **justification** : la règle utilisée et les numéros des lignes citées. Les prémisses viennent en premier, au-dessus d'un trait. La preuve est terminée quand la dernière ligne est la conclusion.","examples":[{"text":"p ∧ q ⊢ q ∧ p (le signe ⊢ se lit « on peut démontrer »)","proof":{"premises":["p ∧ q"],"lines":[{"d":0,"f":"q","r":"∧E","c":"1"},{"d":0,"f":"p","r":"∧E","c":"1"},{"d":0,"f":"q ∧ p","r":"∧I","c":"2, 3"}]}}]},{"title":"Règles de la conjonction","body":"- **∧I** (introduction) : de `A` (ligne m) et `B` (ligne n), on écrit `A ∧ B`, justifié par « ∧I m, n ».\n- **∧E** (élimination) : de `A ∧ B` (ligne m), on écrit `A`, ou bien `B`, justifié par « ∧E m ».\n- **R** (réitération) : on recopie une ligne déjà obtenue.\n\nIci `A` et `B` désignent des formules quelconques, simples ou complexes."},{"title":"Élimination de l'implication","body":"**→E** (*modus ponens*) : de `A → B` (ligne m) et de `A` (ligne n), on écrit `B`, justifié par « →E m, n ».","examples":[{"proof":{"premises":["p → q","p"],"lines":[{"d":0,"f":"q","r":"→E","c":"1, 2"}]}}]}],"exercises":[{"id":"c3-1","type":"mcq","prompt":"Que faut-il citer pour appliquer →E et obtenir `B` ?","choices":["Une ligne `A → B` et une ligne `A`","Une ligne `A → B` et une ligne `B`","Une seule ligne `A → B`"],"answer":0},{"id":"c3-2","type":"proof","justifyOnly":true,"premises":["p ∧ q"],"conclusion":"q ∧ p","rules":["R","∧I","∧E","→E"],"given":[{"d":0,"f":"q"},{"d":0,"f":"p"},{"d":0,"f":"q ∧ p"}],"solution":[{"d":0,"f":"q","r":"∧E","c":"1"},{"d":0,"f":"p","r":"∧E","c":"1"},{"d":0,"f":"q ∧ p","r":"∧I","c":"2, 3"}]},{"id":"c3-3","type":"proof","premises":["p → q","p"],"conclusion":"q","rules":["R","∧I","∧E","→E"],"solution":[{"d":0,"f":"q","r":"→E","c":"1, 2"}]},{"id":"c3-4","type":"mcq","prompt":"La ligne 1 est `p ∧ q`. Que peut-on écrire avec « ∧E 1 » ?","choices":["q","p → q","q ∧ r"],"formulas":true,"answer":0},{"id":"c3-5","type":"proof","premises":["p ∧ q"],"conclusion":"q ∧ p","rules":["R","∧I","∧E","→E"],"solution":[{"d":0,"f":"q","r":"∧E","c":"1"},{"d":0,"f":"p","r":"∧E","c":"1"},{"d":0,"f":"q ∧ p","r":"∧I","c":"2, 3"}]},{"id":"c3-6","type":"proof","premises":["p","p → q","q → r"],"conclusion":"r","rules":["R","∧I","∧E","→E"],"solution":[{"d":0,"f":"q","r":"→E","c":"2, 1"},{"d":0,"f":"r","r":"→E","c":"3, 4"}],"explanation":"Deux modus ponens à la suite : on obtient q, puis r."},{"id":"c3-7","type":"proof","premises":["p ∧ (p → q)"],"conclusion":"q","rules":["R","∧I","∧E","→E"],"solution":[{"d":0,"f":"p","r":"∧E","c":"1"},{"d":0,"f":"p → q","r":"∧E","c":"1"},{"d":0,"f":"q","r":"→E","c":"3, 2"}]},{"id":"c3-8","type":"mcq","prompt":"Dans la justification « →E 1, 2 », que désignent 1 et 2 ?","choices":["Les numéros des lignes utilisées","Le nombre de prémisses","La profondeur de la sous-preuve"],"answer":0}]},{"id":"l2","title":"Hypothèses et →I","cours":[{"title":"Supposer pour démontrer","body":"Pour démontrer `A → B`, on **suppose** `A` et on cherche `B`. L'hypothèse ouvre une **sous-preuve**, décalée vers la droite par un nouveau trait vertical.\n\nQuand on a obtenu `B`, on **ferme** la sous-preuve et on écrit `A → B` au niveau d'en dessous, justifié par **→I** et l'intervalle de la sous-preuve (par exemple « →I 3-5 »).","examples":[{"text":"p → q, q → r ⊢ p → r","proof":{"premises":["p → q","q → r"],"lines":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"→E","c":"1, 3"},{"d":1,"f":"r","r":"→E","c":"2, 4"},{"d":0,"f":"p → r","r":"→I","c":"3-5"}]}}]},{"title":"Ce qui reste accessible","body":"Dans une sous-preuve, on peut citer les lignes au-dessus d'elle, y compris les prémisses.\n\nUne fois la sous-preuve fermée, ses lignes ne sont **plus accessibles** : elles dépendaient d'une hypothèse qu'on a abandonnée. On ne peut plus citer que la sous-preuve **entière**, sous la forme « 3-5 ».\n\nUne preuve n'est terminée que lorsque toutes ses sous-preuves sont fermées."}],"exercises":[{"id":"c3-9","type":"mcq","prompt":"Quand peut-on citer une ligne qui se trouve dans une sous-preuve ?","choices":["Seulement tant que cette sous-preuve est ouverte","N'importe où après elle","Jamais"],"answer":0},{"id":"c3-10","type":"proof","justifyOnly":true,"premises":["p → q","q → r"],"conclusion":"p → r","rules":["Hyp","R","∧I","∧E","→I","→E"],"given":[{"d":1,"f":"p"},{"d":1,"f":"q"},{"d":1,"f":"r"},{"d":0,"f":"p → r"}],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"→E","c":"1, 3"},{"d":1,"f":"r","r":"→E","c":"2, 4"},{"d":0,"f":"p → r","r":"→I","c":"3-5"}]},{"id":"c3-11","type":"proof","prompt":"Démontre sans prémisse (commence par une hypothèse) :","premises":[],"conclusion":"p → p","rules":["Hyp","R","∧I","∧E","→I","→E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"p","r":"R","c":"1"},{"d":0,"f":"p → p","r":"→I","c":"1-2"}],"explanation":"Une formule démontrable sans prémisse est un théorème : c'est l'équivalent, pour les preuves, d'une tautologie."},{"id":"c3-12","type":"proof","premises":["p"],"conclusion":"q → p","rules":["Hyp","R","∧I","∧E","→I","→E"],"solution":[{"d":1,"f":"q","r":"Hyp"},{"d":1,"f":"p","r":"R","c":"1"},{"d":0,"f":"q → p","r":"→I","c":"2-3"}],"explanation":"Dans la sous-preuve, on réitère p, accessible depuis les prémisses."},{"id":"c3-13","type":"proof","premises":["p → q","q → r"],"conclusion":"p → r","rules":["Hyp","R","∧I","∧E","→I","→E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"→E","c":"1, 3"},{"d":1,"f":"r","r":"→E","c":"2, 4"},{"d":0,"f":"p → r","r":"→I","c":"3-5"}]},{"id":"c3-14","type":"mcq","prompt":"Que cite-t-on pour justifier `A → B` par →I ?","choices":["Une sous-preuve qui commence par l'hypothèse `A` et finit par `B`","Une ligne `A` et une ligne `B`","Une ligne `B` seulement"],"answer":0},{"id":"c3-15","type":"proof","premises":["(p ∧ q) → r"],"conclusion":"p → (q → r)","rules":["Hyp","R","∧I","∧E","→I","→E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":2,"f":"q","r":"Hyp"},{"d":2,"f":"p ∧ q","r":"∧I","c":"2, 3"},{"d":2,"f":"r","r":"→E","c":"1, 4"},{"d":1,"f":"q → r","r":"→I","c":"3-5"},{"d":0,"f":"p → (q → r)","r":"→I","c":"2-6"}],"explanation":"Deux sous-preuves imbriquées : une hypothèse pour chaque antécédent."},{"id":"c3-16","type":"proof","premises":["p → (q → r)"],"conclusion":"(p ∧ q) → r","rules":["Hyp","R","∧I","∧E","→I","→E"],"solution":[{"d":1,"f":"p ∧ q","r":"Hyp"},{"d":1,"f":"p","r":"∧E","c":"2"},{"d":1,"f":"q","r":"∧E","c":"2"},{"d":1,"f":"q → r","r":"→E","c":"1, 3"},{"d":1,"f":"r","r":"→E","c":"5, 4"},{"d":0,"f":"(p ∧ q) → r","r":"→I","c":"2-6"}]}]},{"id":"l3","title":"Disjonction et biconditionnel","cours":[{"title":"Introduire et éliminer ∨","body":"- **∨I** : de `A` (ligne m), on écrit `A ∨ B` ou `B ∨ A`, pour n'importe quelle formule `B`. Justification : « ∨I m ».\n- **∨E** (raisonnement par cas) : de `A ∨ B` (ligne m), d'une sous-preuve de `A` à `C` (i-j) et d'une sous-preuve de `B` à `C` (k-l), on écrit `C`. Justification : « ∨E m, i-j, k-l ».\n\nLes deux sous-preuves se suivent : on ferme la première et on ouvre aussitôt la seconde (bouton « Hypothèse suivante »).","examples":[{"proof":{"premises":["p ∨ q","p → r","q → r"],"lines":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"r","r":"→E","c":"2, 4"},{"d":1,"f":"q","r":"Hyp"},{"d":1,"f":"r","r":"→E","c":"3, 6"},{"d":0,"f":"r","r":"∨E","c":"1, 4-5, 6-7"}]},"note":"Dans les deux cas on obtient r : r est donc établi."}]},{"title":"Le biconditionnel","body":"- **↔I** : d'une sous-preuve de `A` à `B` et d'une sous-preuve de `B` à `A`, on écrit `A ↔ B`. Justification : « ↔I i-j, k-l ».\n- **↔E** : de `A ↔ B` et de `A`, on écrit `B` (et de `A ↔ B` et `B`, on écrit `A`). Justification : « ↔E m, n »."}],"exercises":[{"id":"c3-17","type":"mcq","prompt":"La ligne 1 est `p`. Que peut-on écrire avec « ∨I 1 » ?","choices":["p ∨ r","p ∧ r","r"],"formulas":true,"answer":0,"explanation":"Si p est vraie, p ∨ r l'est aussi, quelle que soit r."},{"id":"c3-18","type":"proof","premises":["p"],"conclusion":"p ∨ q","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"solution":[{"d":0,"f":"p ∨ q","r":"∨I","c":"1"}]},{"id":"c3-19","type":"proof","justifyOnly":true,"premises":["p ∨ q"],"conclusion":"q ∨ p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"given":[{"d":1,"f":"p"},{"d":1,"f":"q ∨ p"},{"d":1,"f":"q"},{"d":1,"f":"q ∨ p"},{"d":0,"f":"q ∨ p"}],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q ∨ p","r":"∨I","c":"2"},{"d":1,"f":"q","r":"Hyp"},{"d":1,"f":"q ∨ p","r":"∨I","c":"4"},{"d":0,"f":"q ∨ p","r":"∨E","c":"1, 2-3, 4-5"}]},{"id":"c3-20","type":"proof","premises":["p ∨ q","p → r","q → r"],"conclusion":"r","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"r","r":"→E","c":"2, 4"},{"d":1,"f":"q","r":"Hyp"},{"d":1,"f":"r","r":"→E","c":"3, 6"},{"d":0,"f":"r","r":"∨E","c":"1, 4-5, 6-7"}]},{"id":"c3-21","type":"mcq","prompt":"Pour conclure `C` par ∨E à partir de `A ∨ B`, il faut…","choices":["une sous-preuve de `A` à `C` et une sous-preuve de `B` à `C`","démontrer `A` et `B`","une seule sous-preuve de `A` à `C`"],"answer":0},{"id":"c3-22","type":"proof","premises":["p ↔ q","q"],"conclusion":"p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"solution":[{"d":0,"f":"p","r":"↔E","c":"1, 2"}]},{"id":"c3-23","type":"proof","premises":["p ∧ q"],"conclusion":"p ↔ q","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"∧E","c":"1"},{"d":1,"f":"q","r":"Hyp"},{"d":1,"f":"p","r":"∧E","c":"1"},{"d":0,"f":"p ↔ q","r":"↔I","c":"2-3, 4-5"}]},{"id":"c3-24","type":"proof","premises":["(p ∨ q) → r"],"conclusion":"p → r","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","↔I","↔E"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"p ∨ q","r":"∨I","c":"2"},{"d":1,"f":"r","r":"→E","c":"1, 3"},{"d":0,"f":"p → r","r":"→I","c":"2-4"}]}]},{"id":"l4","title":"Négation et absurde","cours":[{"title":"La contradiction ⊥","body":"Le symbole `⊥` (« absurde ») représente une contradiction.\n\n- **¬E** : de `A` et de `¬A`, on écrit `⊥`. Justification : « ¬E m, n ».\n- **¬I** : d'une sous-preuve qui suppose `A` et aboutit à `⊥`, on écrit `¬A`. Si une hypothèse mène à l'absurde, elle est fausse.","examples":[{"text":"p ⊢ ¬¬p","proof":{"premises":["p"],"lines":[{"d":1,"f":"¬p","r":"Hyp"},{"d":1,"f":"⊥","r":"¬E","c":"1, 2"},{"d":0,"f":"¬¬p","r":"¬I","c":"2-3"}]}}]},{"title":"Explosion et raisonnement par l'absurde","body":"- **X** (*ex falso quodlibet*) : de `⊥`, on peut écrire n'importe quelle formule.\n- **RA** (raisonnement par l'absurde) : d'une sous-preuve qui suppose `¬A` et aboutit à `⊥`, on écrit `A`.\n\n¬I et RA se ressemblent : ¬I supprime une hypothèse `A` en concluant `¬A` ; RA supprime une hypothèse `¬A` en concluant `A`."}],"exercises":[{"id":"c3-25","type":"mcq","prompt":"Que permet la règle ¬E ?","choices":["De `A` et `¬A`, obtenir `⊥`","De `¬¬A`, obtenir `A`","De `⊥`, obtenir n'importe quelle formule"],"answer":0},{"id":"c3-26","type":"proof","premises":["p","¬p"],"conclusion":"⊥","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"solution":[{"d":0,"f":"⊥","r":"¬E","c":"1, 2"}]},{"id":"c3-27","type":"proof","premises":["p","¬p"],"conclusion":"q","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"solution":[{"d":0,"f":"⊥","r":"¬E","c":"1, 2"},{"d":0,"f":"q","r":"X","c":"3"}],"explanation":"D'une contradiction on peut tout déduire."},{"id":"c3-28","type":"proof","justifyOnly":true,"premises":["p → q","¬q"],"conclusion":"¬p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"given":[{"d":1,"f":"p"},{"d":1,"f":"q"},{"d":1,"f":"⊥"},{"d":0,"f":"¬p"}],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"→E","c":"1, 3"},{"d":1,"f":"⊥","r":"¬E","c":"4, 2"},{"d":0,"f":"¬p","r":"¬I","c":"3-5"}],"explanation":"C'est la démonstration du modus tollens."},{"id":"c3-29","type":"proof","premises":["p"],"conclusion":"¬¬p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"solution":[{"d":1,"f":"¬p","r":"Hyp"},{"d":1,"f":"⊥","r":"¬E","c":"1, 2"},{"d":0,"f":"¬¬p","r":"¬I","c":"2-3"}]},{"id":"c3-30","type":"proof","premises":["¬¬p"],"conclusion":"p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"solution":[{"d":1,"f":"¬p","r":"Hyp"},{"d":1,"f":"⊥","r":"¬E","c":"2, 1"},{"d":0,"f":"p","r":"RA","c":"2-3"}],"explanation":"On suppose ¬p, on obtient une contradiction avec ¬¬p, donc p par l'absurde."},{"id":"c3-31","type":"mcq","prompt":"Quelle est la différence entre ¬I et RA ?","choices":["¬I suppose `A` et conclut `¬A` ; RA suppose `¬A` et conclut `A`","Il n'y en a aucune","RA n'utilise pas de sous-preuve"],"answer":0},{"id":"c3-32","type":"proof","premises":["p → q","p → ¬q"],"conclusion":"¬p","rules":["Hyp","R","∧I","∧E","→I","→E","∨I","∨E","¬I","¬E","X","RA"],"solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q","r":"→E","c":"1, 3"},{"d":1,"f":"¬q","r":"→E","c":"2, 3"},{"d":1,"f":"⊥","r":"¬E","c":"4, 5"},{"d":0,"f":"¬p","r":"¬I","c":"3-6"}]}]},{"id":"l5","title":"Règles dérivées et stratégie","cours":[{"title":"Des raccourcis démontrés","body":"Certaines combinaisons reviennent si souvent qu'on en fait des règles. Elles ne permettent rien de nouveau : on pourrait toujours les remplacer par les règles de base.\n\n- **MT** (*modus tollens*) : de `A → B` et `¬B`, on écrit `¬A`.\n- **DS** (syllogisme disjonctif) : de `A ∨ B` et `¬A`, on écrit `B` (ou de `¬B`, on écrit `A`).\n- **DNE** : de `¬¬A`, on écrit `A`.\n- **TND** (tiers exclu) : d'une sous-preuve de `A` à `C` et d'une sous-preuve de `¬A` à `C`, on écrit `C`."},{"title":"Comment chercher une preuve","body":"Regarde le connecteur principal de ce que tu veux obtenir :\n- `A → B` : suppose `A`, cherche `B`, puis →I.\n- `¬A` : suppose `A`, cherche `⊥`, puis ¬I.\n- `A ∧ B` : obtiens `A` et `B` séparément, puis ∧I.\n- `A ↔ B` : deux sous-preuves, puis ↔I.\n\nRegarde aussi les prémisses : une disjonction appelle ∨E ou DS ; une implication appelle →E ou MT.\n\nSi rien ne marche, raisonne par l'absurde : suppose `¬A` et cherche `⊥`."}],"exercises":[{"id":"c3-33","type":"proof","premises":["p → q","¬q"],"conclusion":"¬p","solution":[{"d":0,"f":"¬p","r":"MT","c":"1, 2"}],"explanation":"Avec la règle dérivée MT, une ligne suffit."},{"id":"c3-34","type":"proof","premises":["p ∨ q","¬p"],"conclusion":"q","solution":[{"d":0,"f":"q","r":"DS","c":"1, 2"}]},{"id":"c3-35","type":"mcq","prompt":"Pour démontrer `A → B`, on commence en général par…","choices":["supposer `A` et chercher `B`","supposer `B` et chercher `A`","supposer `¬B`"],"answer":0},{"id":"c3-36","type":"proof","premises":["p → q"],"conclusion":"¬q → ¬p","solution":[{"d":1,"f":"¬q","r":"Hyp"},{"d":1,"f":"¬p","r":"MT","c":"1, 2"},{"d":0,"f":"¬q → ¬p","r":"→I","c":"2-3"}],"explanation":"C'est la contraposée."},{"id":"c3-37","type":"proof","premises":["¬(p ∨ q)"],"conclusion":"¬p","solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"p ∨ q","r":"∨I","c":"2"},{"d":1,"f":"⊥","r":"¬E","c":"3, 1"},{"d":0,"f":"¬p","r":"¬I","c":"2-4"}],"explanation":"Pour obtenir une négation : supposer p et trouver une contradiction (une moitié de De Morgan)."},{"id":"c3-38","type":"proof","prompt":"Démontre le tiers exclu, sans prémisse :","premises":[],"conclusion":"p ∨ ¬p","solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"p ∨ ¬p","r":"∨I","c":"1"},{"d":1,"f":"¬p","r":"Hyp"},{"d":1,"f":"p ∨ ¬p","r":"∨I","c":"3"},{"d":0,"f":"p ∨ ¬p","r":"TND","c":"1-2, 3-4"}]},{"id":"c3-39","type":"mcq","prompt":"Pour démontrer `¬A`, la stratégie habituelle est…","choices":["supposer `A` et chercher `⊥`, puis ¬I","supposer `¬A` et chercher `⊥`","appliquer ∨I"],"answer":0},{"id":"c3-40","type":"proof","premises":["p ∨ q","p → r","¬r"],"conclusion":"q","solution":[{"d":0,"f":"¬p","r":"MT","c":"2, 3"},{"d":0,"f":"q","r":"DS","c":"1, 4"}]}]}],"test":{"size":8,"exercises":[{"id":"c3-t1","type":"proof","premises":["p → (q ∧ r)"],"conclusion":"(p → q) ∧ (p → r)","solution":[{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q ∧ r","r":"→E","c":"1, 2"},{"d":1,"f":"q","r":"∧E","c":"3"},{"d":0,"f":"p → q","r":"→I","c":"2-4"},{"d":1,"f":"p","r":"Hyp"},{"d":1,"f":"q ∧ r","r":"→E","c":"1, 6"},{"d":1,"f":"r","r":"∧E","c":"7"},{"d":0,"f":"p → r","r":"→I","c":"6-8"},{"d":0,"f":"(p → q) ∧ (p → r)","r":"∧I","c":"5, 9"}]},{"id":"c3-t2","type":"proof","premises":["¬p ∨ q"],"conclusion":"p → q","solution":[{"d":1,"f":"p","r":"Hyp"},{"d":2,"f":"¬p","r":"Hyp"},{"d":2,"f":"⊥","r":"¬E","c":"2, 3"},{"d":2,"f":"q","r":"X","c":"4"},{"d":2,"f":"q","r":"Hyp"},{"d":2,"f":"q","r":"R","c":"6"},{"d":1,"f":"q","r":"∨E","c":"1, 3-5, 6-7"},{"d":0,"f":"p → q","r":"→I","c":"2-8"}]}]}},"logique/ch4":{"id":"ch4","title":"Logique des prédicats","summary":"Noms, prédicats, quantificateurs : formaliser « tous », « certains », « aucun ».","symbols":["¬","∧","∨","→","↔","∀","∃","(",")","x","y","z"],"lessons":[{"id":"l1","title":"Noms et prédicats","cours":[{"title":"Au-delà des propositions","body":"« Tous les hommes sont mortels ; Socrate est un homme ; donc Socrate est mortel. » En logique propositionnelle, ces trois phrases deviennent `p`, `q`, `r` : la validité disparaît. Il faut regarder **à l'intérieur** des phrases.\n\nLa logique des prédicats distingue :\n- les **noms** (constantes), qui désignent un objet : `a`, `b`, `s`… ;\n- les **prédicats**, qui disent quelque chose d'un objet : `Hx` pour « x est un homme ».","examples":[{"text":"Socrate est un homme.","formula":"Hs","note":"H : « x est un homme » ; s : Socrate. Le prédicat s'écrit en majuscule, le nom collé derrière."}]},{"title":"Relations","body":"Un prédicat peut avoir plusieurs places : `Axy` pour « x aime y ». L'ordre compte : `Ajm` (Jean aime Marie) n'est pas `Amj` (Marie aime Jean).\n\nLes énoncés atomiques se combinent ensuite avec les connecteurs déjà connus.","examples":[{"text":"Jean aime Marie mais Marie n'aime pas Jean.","formula":"Ajm ∧ ¬Amj"}]}],"exercises":[{"id":"c4-1","type":"formalize","sentence":"Socrate est un philosophe.","legend":{"Px":"x est un philosophe","s":"Socrate"},"answer":"Ps"},{"id":"c4-2","type":"formalize","sentence":"Platon n'est pas un sophiste.","legend":{"Sx":"x est un sophiste","b":"Platon"},"answer":"¬Sb"},{"id":"c4-3","type":"mcq","prompt":"Avec `Axy` : « x admire y », j : Jean, m : Marie, que dit `Amj` ?","choices":["Marie admire Jean.","Jean admire Marie.","Jean et Marie s'admirent."],"answer":0,"explanation":"Le premier argument est celui qui admire, le second celui qui est admiré."},{"id":"c4-4","type":"formalize","sentence":"Jean admire Marie.","legend":{"Axy":"x admire y","j":"Jean","m":"Marie"},"answer":"Ajm"},{"id":"c4-5","type":"formalize","sentence":"Si Socrate est un philosophe, alors Socrate est sage.","legend":{"Px":"x est un philosophe","Wx":"x est sage","s":"Socrate"},"answer":"Ps → Ws"},{"id":"c4-6","type":"formalize","sentence":"Jean et Marie s'admirent l'un l'autre.","legend":{"Axy":"x admire y","j":"Jean","m":"Marie"},"answer":"Ajm ∧ Amj"},{"id":"c4-7","type":"mcq","prompt":"Dans `Ps`, que désigne `s` ?","choices":["Un objet (un nom)","Une propriété","Une phrase entière"],"answer":0}]},{"id":"l2","title":"Les quantificateurs","cours":[{"title":"∀ et ∃","body":"- `∀x Fx` : « pour tout x, x est F », « tout est F ».\n- `∃x Fx` : « il existe au moins un x tel que x est F », « quelque chose est F ».\n\nLes **variables** (`x`, `y`, `z`) ne désignent pas un objet précis : elles marquent les places sur lesquelles porte le quantificateur.\n\nLe quantificateur porte sur ce qui suit **immédiatement** : pour qu'il porte sur une formule complexe, il faut des parenthèses, comme dans `∀x(Fx → Gx)`."},{"title":"Négation et quantificateurs","body":"- « Rien n'est F » : `¬∃x Fx`, ou de façon équivalente `∀x ¬Fx`.\n- « Tout n'est pas F », « pas tout est F » : `¬∀x Fx`, équivalent à `∃x ¬Fx`.\n\nNier « tout » donne « au moins un ne… pas » ; nier « il existe » donne « aucun ».","examples":[{"text":"Personne n'est parfait.","formula":"¬∃x Px","note":"ou ∀x¬Px"}]}],"exercises":[{"id":"c4-8","type":"formalize","sentence":"Tout est matériel.","legend":{"Mx":"x est matériel"},"answer":"∀x Mx"},{"id":"c4-9","type":"formalize","sentence":"Quelque chose est éternel.","legend":{"Ex":"x est éternel"},"answer":"∃x Ex"},{"id":"c4-10","type":"formalize","sentence":"Rien n'est parfait.","legend":{"Px":"x est parfait"},"answer":"¬∃x Px","explanation":"¬∃x Px et ∀x ¬Px sont équivalentes : les deux sont acceptées."},{"id":"c4-11","type":"mcq","prompt":"Quelle formule est équivalente à `¬∀x Fx` ?","choices":["∃x¬Fx","∀x¬Fx","¬∃xFx"],"formulas":true,"answer":0,"explanation":"Si tout n'est pas F, c'est qu'au moins une chose n'est pas F."},{"id":"c4-12","type":"formalize","sentence":"Tout n'est pas matériel.","legend":{"Mx":"x est matériel"},"answer":"¬∀x Mx","explanation":"« Tout n'est pas matériel » signifie : il y a au moins une chose non matérielle."},{"id":"c4-13","type":"formula","prompt":"Réécris `¬∃x Fx` sans mettre ¬ devant le quantificateur.","answer":"∀x¬Fx","negationOnAtoms":true},{"id":"c4-14","type":"formalize","sentence":"Si quelque chose est éternel, alors tout est ordonné.","legend":{"Ex":"x est éternel","Ox":"x est ordonné"},"answer":"∃x Ex → ∀x Ox"}]},{"id":"l3","title":"Tous, certains, aucun","cours":[{"title":"Les quatre formes catégoriques","body":"- « Tous les H sont M » : `∀x(Hx → Mx)`\n- « Aucun H n'est M » : `∀x(Hx → ¬Mx)`\n- « Certains H sont M » : `∃x(Hx ∧ Mx)`\n- « Certains H ne sont pas M » : `∃x(Hx ∧ ¬Mx)`\n\nRègle pratique : **∀ va avec →**, **∃ va avec ∧**.","examples":[{"text":"Tous les hommes sont mortels.","formula":"∀x(Hx → Mx)"},{"text":"Certains hommes sont philosophes.","formula":"∃x(Hx ∧ Px)"}]},{"title":"Les pièges","body":"- `∀x(Hx ∧ Mx)` dit que **tout** est homme et mortel : trop fort.\n- `∃x(Hx → Mx)` est vrai dès qu'il existe une chose qui n'est pas un homme : trop faible.\n- « **Seuls** les H sont M » : `∀x(Mx → Hx)` (si quelque chose est M, c'est un H).\n- « Les H sont M » au sens général se lit en général comme « tous les H »."}],"exercises":[{"id":"c4-15","type":"formalize","sentence":"Tous les hommes sont mortels.","legend":{"Hx":"x est un homme","Mx":"x est mortel"},"answer":"∀x(Hx → Mx)"},{"id":"c4-16","type":"formalize","sentence":"Certains philosophes sont grecs.","legend":{"Px":"x est un philosophe","Gx":"x est grec"},"answer":"∃x(Px ∧ Gx)"},{"id":"c4-17","type":"formalize","sentence":"Aucun sophiste n'est sage.","legend":{"Sx":"x est un sophiste","Wx":"x est sage"},"answer":"∀x(Sx → ¬Wx)","explanation":"¬∃x(Sx ∧ Wx) est équivalent et accepté."},{"id":"c4-18","type":"formalize","sentence":"Certains hommes ne sont pas philosophes.","legend":{"Hx":"x est un homme","Px":"x est un philosophe"},"answer":"∃x(Hx ∧ ¬Px)"},{"id":"c4-19","type":"mcq","prompt":"Pourquoi `∃x(Hx → Mx)` ne traduit-il pas « certains hommes sont mortels » ?","choices":["Il est vrai dès qu'existe une chose qui n'est pas un homme.","Il dit que tout est homme.","Il n'y a aucune différence."],"answer":0,"explanation":"Une implication à antécédent faux est vraie : n'importe quelle pierre rend Hx → Mx vrai."},{"id":"c4-20","type":"formalize","sentence":"Seuls les citoyens votent.","legend":{"Cx":"x est un citoyen","Vx":"x vote"},"answer":"∀x(Vx → Cx)","explanation":"« Seuls les C votent » : si quelqu'un vote, c'est un citoyen."},{"id":"c4-21","type":"formalize","sentence":"Tous les philosophes grecs sont sages.","legend":{"Px":"x est un philosophe","Gx":"x est grec","Wx":"x est sage"},"answer":"∀x((Px ∧ Gx) → Wx)"},{"id":"c4-22","type":"mcq","prompt":"Quelle formule dit « Tous les H sont M » ?","choices":["∀x(Hx → Mx)","∀x(Hx ∧ Mx)","∀xHx → ∀xMx"],"formulas":true,"answer":0,"explanation":"∀x(Hx ∧ Mx) dit que tout est H ; ∀xHx → ∀xMx ne dit rien si tout n'est pas H."}]},{"id":"l4","title":"Portée et relations","cours":[{"title":"Variables libres et liées","body":"Une variable est **liée** quand elle est dans la portée d'un quantificateur sur cette variable ; sinon elle est **libre**. Dans `∀x Rxy`, `x` est liée et `y` est libre.\n\nUne formule sans variable libre est un **énoncé** : elle est vraie ou fausse. `Fx` seul n'est ni vrai ni faux (quel x ?).\n\nLa **portée** d'un quantificateur est la formule sur laquelle il porte : dans `∀x Fx → Gx`, la portée de ∀x est seulement `Fx`, et le `x` de `Gx` est libre."},{"title":"Plusieurs quantificateurs","body":"L'ordre des quantificateurs différents compte :\n- `∀x∃y Axy` : « tout le monde aime quelqu'un » (chacun peut aimer une personne différente) ;\n- `∃y∀x Axy` : « quelqu'un est aimé de tous » (une même personne), beaucoup plus fort.\n\nDeux quantificateurs de même sorte peuvent s'échanger : `∀x∀y Rxy` équivaut à `∀y∀x Rxy`.","examples":[{"text":"Tout le monde aime quelqu'un.","formula":"∀x∃y Axy"},{"text":"Quelqu'un aime tout le monde.","formula":"∃x∀y Axy"}]}],"exercises":[{"id":"c4-23","type":"mcq","prompt":"Dans `∀x(Fx → Rxy)`, quelle variable est libre ?","choices":["y","x","Aucune","x et y"],"answer":0},{"id":"c4-24","type":"mcq","prompt":"Dans `∀x Fx → Gx`, sur quoi porte ∀x ?","choices":["Seulement sur `Fx`","Sur `Fx → Gx`","Seulement sur `Gx`"],"answer":0,"explanation":"Sans parenthèses, le quantificateur porte sur la plus petite formule qui suit."},{"id":"c4-25","type":"formalize","sentence":"Tout le monde aime quelqu'un.","legend":{"Axy":"x aime y"},"answer":"∀x∃y Axy"},{"id":"c4-26","type":"formalize","sentence":"Quelqu'un est aimé de tout le monde.","legend":{"Axy":"x aime y"},"answer":"∃y∀x Axy"},{"id":"c4-27","type":"formalize","sentence":"Marie aime tout le monde.","legend":{"Axy":"x aime y","m":"Marie"},"answer":"∀x Amx"},{"id":"c4-28","type":"formalize","sentence":"Personne n'aime Jean.","legend":{"Axy":"x aime y","j":"Jean"},"answer":"¬∃x Axj"},{"id":"c4-29","type":"mcq","prompt":"Laquelle de ces formules implique les autres ?","choices":["∃y∀x Axy","∀x∃y Axy","Aucune n'implique l'autre"],"formulas":false,"answer":0,"explanation":"Si une même personne est aimée de tous, alors chacun aime quelqu'un. L'inverse ne vaut pas."},{"id":"c4-30","type":"formalize","sentence":"Tout philosophe admire quelque philosophe.","legend":{"Px":"x est un philosophe","Axy":"x admire y"},"answer":"∀x(Px → ∃y(Py ∧ Axy))"}]}],"test":{"size":10,"exercises":[{"id":"c4-t1","type":"formalize","sentence":"Aucun philosophe n'admire un sophiste.","legend":{"Px":"x est un philosophe","Sx":"x est un sophiste","Axy":"x admire y"},"answer":"∀x(Px → ¬∃y(Sy ∧ Axy))","explanation":"Équivalent : ¬∃x∃y(Px ∧ Sy ∧ Axy)."},{"id":"c4-t2","type":"formalize","sentence":"Seuls les sages sont heureux.","legend":{"Wx":"x est sage","Hx":"x est heureux"},"answer":"∀x(Hx → Wx)"}]}},"logique/ch5":{"id":"ch5","title":"Modèles et preuves","summary":"Vérité dans un modèle, contre-modèles, règles de déduction pour ∀ et ∃.","symbols":["¬","∧","∨","→","↔","∀","∃","⊥","(",")","x","y"],"lessons":[{"id":"l1","title":"Qu'est-ce qu'un modèle ?","cours":[{"title":"Interpréter les symboles","body":"En logique propositionnelle, une valuation suffit : chaque lettre est V ou F. En logique des prédicats, il faut un **modèle**, qui fixe :\n- un **domaine** : l'ensemble des objets dont on parle (non vide) ;\n- pour chaque **nom**, l'objet qu'il désigne ;\n- pour chaque **prédicat**, son **extension** : l'ensemble des objets (ou des paires, pour une relation) dont il est vrai.","examples":[{"text":"Domaine {1, 2, 3} ; a désigne 1 ; F = {1, 2} ; R = {⟨1,2⟩, ⟨2,3⟩}","note":"Fa est vrai (1 est dans F) ; Rab est vrai si b désigne 2."}]},{"title":"Vérité des énoncés quantifiés","body":"- `∀x Fx` est vrai si **chaque** objet du domaine est dans l'extension de F.\n- `∃x Fx` est vrai si **au moins un** objet y est.\n- `∀x(Fx → Gx)` est vrai si tout objet de F est aussi dans G.\n\nUn même énoncé peut être vrai dans un modèle et faux dans un autre : il ne s'agit plus de « tables » mais de « mondes miniatures »."}],"exercises":[{"id":"c5-1","type":"modeltruth","model":{"domain":["1","2","3"],"constants":{"a":"1","b":"3"},"predicates":{"F":["1","2"],"G":["2"]}},"sentences":["Fa","Fb","∃x Gx","∀x Fx"]},{"id":"c5-2","type":"modeltruth","model":{"domain":["1","2","3"],"constants":{"a":"1"},"predicates":{"F":["1","2"],"G":["2"]}},"sentences":["∀x(Gx → Fx)","∀x(Fx → Gx)","∃x(Fx ∧ ¬Gx)","¬∃x(Gx ∧ ¬Fx)"]},{"id":"c5-3","type":"mcq","prompt":"Domaine {1, 2}, F = {} (vide). Que vaut `∀x(Fx → Gx)` ?","choices":["Vrai","Faux"],"answer":0,"explanation":"Aucun objet n'est F : l'implication Fx → Gx est vraie pour chaque objet. Un universel « vide » est vrai."},{"id":"c5-4","type":"modeltruth","model":{"domain":["1","2","3"],"constants":{"a":"1"},"predicates":{"R":[["1","2"],["2","3"],["3","3"]]}},"sentences":["∃x Rax","∃x Rxa","∀x∃y Rxy","∃y∀x Rxy"]},{"id":"c5-5","type":"mcq","prompt":"Que faut-il pour que `∃x Fx` soit vrai dans un modèle ?","choices":["Qu'au moins un objet du domaine soit dans l'extension de F","Que tous les objets soient dans F","Qu'un nom désigne un objet de F"],"answer":0},{"id":"c5-6","type":"modeltruth","model":{"domain":["Socrate","Platon","Médor"],"constants":{"s":"Socrate","m":"Médor"},"predicates":{"H":["Socrate","Platon"],"M":["Socrate","Platon","Médor"],"P":["Socrate","Platon"]}},"sentences":["∀x(Hx → Mx)","∀x(Mx → Hx)","∃x(Hx ∧ Px)","Pm ∨ Hs"]},{"id":"c5-7","type":"mcq","prompt":"Un énoncé vrai dans **tous** les modèles est dit…","choices":["logiquement vrai (valide)","satisfiable","contingent"],"answer":0,"explanation":"C'est l'équivalent, en logique des prédicats, d'une tautologie."}]},{"id":"l2","title":"Contre-modèles","cours":[{"title":"Montrer qu'un argument est invalide","body":"Un argument est **valide** si sa conclusion est vraie dans tout modèle où ses prémisses sont vraies.\n\nPour montrer qu'il est **invalide**, il suffit d'un **contre-modèle** : un modèle où les prémisses sont vraies et la conclusion fausse. C'est la version « prédicats » du contre-exemple.","examples":[{"text":"Quelque chose est F, quelque chose est G ; donc quelque chose est F et G.","note":"Invalide : domaine {1, 2}, F = {1}, G = {2}."}]},{"title":"Méthode","body":"- Commence par le plus petit domaine possible (1 ou 2 objets).\n- Rends la conclusion fausse : un ∀ faux demande un objet qui fait exception ; un ∃ faux demande qu'aucun objet ne convienne.\n- Ajuste ensuite les extensions pour rendre chaque prémisse vraie.\n\nDans l'exercice, chaque énoncé affiche en direct s'il a la valeur demandée."}],"exercises":[{"id":"c5-8","type":"buildmodel","prompt":"Montre que l'argument « ∃x Fx, ∃x Gx, donc ∃x(Fx ∧ Gx) » est invalide.","true":["∃x Fx","∃x Gx"],"false":["∃x(Fx ∧ Gx)"]},{"id":"c5-9","type":"buildmodel","prompt":"Montre que de « quelque chose est F » on ne peut pas conclure « tout est F ».","true":["∃x Fx"],"false":["∀x Fx"]},{"id":"c5-10","type":"buildmodel","prompt":"« Tous les F sont G ; b est G ; donc b est F. » Construis un contre-modèle.","true":["∀x(Fx → Gx)","Gb"],"false":["Fb"],"explanation":"C'est l'affirmation du conséquent, version prédicats."},{"id":"c5-11","type":"mcq","prompt":"Qu'est-ce qu'un contre-modèle d'un argument ?","choices":["Un modèle où les prémisses sont vraies et la conclusion fausse","Un modèle où tout est faux","Un modèle où la conclusion est vraie"],"answer":0},{"id":"c5-12","type":"buildmodel","prompt":"Montre que « ∀x(Fx ∨ Gx) » n'implique pas « ∀x Fx ∨ ∀x Gx ».","true":["∀x(Fx ∨ Gx)"],"false":["∀x Fx ∨ ∀x Gx"]},{"id":"c5-13","type":"buildmodel","prompt":"Montre que « tout le monde aime quelqu'un » n'implique pas « quelqu'un est aimé de tous ».","true":["∀x∃y Rxy"],"false":["∃y∀x Rxy"],"explanation":"Avec deux objets qui s'aiment chacun eux-mêmes seulement, par exemple."},{"id":"c5-14","type":"mcq","prompt":"« Tous les F sont G ; a est F ; donc a est G. » Peut-on trouver un contre-modèle ?","choices":["Non : l'argument est valide","Oui, avec un domaine de deux objets","Oui, si G est vide"],"answer":0,"explanation":"Si a est dans F et que F est inclus dans G, a est dans G : pas de contre-modèle possible."}]},{"id":"l3","title":"Preuves : ∀E et ∃I","cours":[{"title":"Élimination de ∀","body":"**∀E** : de `∀x A`, on peut écrire `A` où chaque occurrence libre de `x` est remplacée par **un même nom**, n'importe lequel. Ce qui vaut de tout vaut de chacun.","examples":[{"text":"∀x(Hx → Mx), Hs ⊢ Ms","proof":{"premises":["∀x(Hx → Mx)","Hs"],"lines":[{"d":0,"f":"Hs → Ms","r":"∀E","c":"1"},{"d":0,"f":"Ms","r":"→E","c":"3, 2"}]}}]},{"title":"Introduction de ∃","body":"**∃I** : d'un énoncé contenant un nom, par exemple `Fa`, on peut écrire `∃x Fx`. Si a est F, quelque chose est F.\n\nOn peut ne remplacer qu'**une partie** des occurrences du nom : de `Raa`, on peut tirer `∃x Rxa` aussi bien que `∃x Rxx`."}],"exercises":[{"id":"c5-15","type":"proof","premises":["∀x(Hx → Mx)","Hs"],"conclusion":"Ms","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"solution":[{"d":0,"f":"Hs → Ms","r":"∀E","c":"1"},{"d":0,"f":"Ms","r":"→E","c":"3, 2"}],"explanation":"Le syllogisme de Socrate, enfin démontré !"},{"id":"c5-16","type":"proof","premises":["Fa"],"conclusion":"∃x Fx","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"solution":[{"d":0,"f":"∃x Fx","r":"∃I","c":"1"}]},{"id":"c5-17","type":"mcq","prompt":"De `∀x Rxx`, que peut-on écrire par ∀E ?","choices":["Rbb","Rab","Rxb"],"formulas":true,"answer":0,"explanation":"Toutes les occurrences de x sont remplacées par le même nom."},{"id":"c5-18","type":"proof","premises":["∀x Fx"],"conclusion":"∃x Fx","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"solution":[{"d":0,"f":"Fa","r":"∀E","c":"1"},{"d":0,"f":"∃x Fx","r":"∃I","c":"2"}],"explanation":"Le domaine n'est jamais vide : si tout est F, quelque chose est F."},{"id":"c5-19","type":"proof","justifyOnly":true,"premises":["∀x(Fx → Gx)","Fa"],"conclusion":"∃x Gx","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"given":[{"d":0,"f":"Fa → Ga"},{"d":0,"f":"Ga"},{"d":0,"f":"∃x Gx"}],"solution":[{"d":0,"f":"Fa → Ga","r":"∀E","c":"1"},{"d":0,"f":"Ga","r":"→E","c":"3, 2"},{"d":0,"f":"∃x Gx","r":"∃I","c":"4"}]},{"id":"c5-20","type":"proof","premises":["∀x(Fx ∧ Gx)"],"conclusion":"Gb","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"solution":[{"d":0,"f":"Fb ∧ Gb","r":"∀E","c":"1"},{"d":0,"f":"Gb","r":"∧E","c":"2"}]},{"id":"c5-21","type":"proof","premises":["∀x Rxx"],"conclusion":"∃x Rxa","rules":["Hyp","R","∧I","∧E","→I","→E","∀E","∃I"],"solution":[{"d":0,"f":"Raa","r":"∀E","c":"1"},{"d":0,"f":"∃x Rxa","r":"∃I","c":"2"}],"explanation":"∃I ne remplace ici que la première occurrence de a."}]},{"id":"l4","title":"Preuves : ∀I, ∃E et conversion","cours":[{"title":"Introduction de ∀","body":"**∀I** : de `Fa`, on peut écrire `∀x Fx`, **à condition** que `a` soit un nom **arbitraire** : il ne doit apparaître dans aucune prémisse ni hypothèse en cours, ni dans la formule obtenue.\n\nIdée : si l'on a démontré que a est F sans rien supposer de particulier sur a, le raisonnement vaut pour n'importe quel objet.","examples":[{"text":"∀x(Fx ∧ Gx) ⊢ ∀x Fx","proof":{"premises":["∀x(Fx ∧ Gx)"],"lines":[{"d":0,"f":"Fa ∧ Ga","r":"∀E","c":"1"},{"d":0,"f":"Fa","r":"∧E","c":"2"},{"d":0,"f":"∀x Fx","r":"∀I","c":"3"}]}}]},{"title":"Élimination de ∃","body":"**∃E** : de `∃x Fx`, on ne sait pas *quel* objet est F. On lui donne un **nom nouveau** dans une hypothèse, `Fa`, et on raisonne. Si l'on aboutit à une conclusion `C` qui ne mentionne pas `a`, on peut écrire `C` hors de la sous-preuve. Justification : « ∃E m, i-j ».\n\nLe nom doit être **nouveau** : absent de `∃x Fx`, de `C`, et de toute prémisse ou hypothèse en cours."},{"title":"Conversion des quantificateurs","body":"**CQ** permet de passer en une ligne de :\n- `¬∃x A` à `∀x ¬A` (et inversement) ;\n- `¬∀x A` à `∃x ¬A` (et inversement)."}],"exercises":[{"id":"c5-22","type":"proof","premises":["∀x(Fx ∧ Gx)"],"conclusion":"∀x Fx","solution":[{"d":0,"f":"Fa ∧ Ga","r":"∀E","c":"1"},{"d":0,"f":"Fa","r":"∧E","c":"2"},{"d":0,"f":"∀x Fx","r":"∀I","c":"3"}]},{"id":"c5-23","type":"mcq","prompt":"Pourquoi ne peut-on pas tirer `∀x Fx` de la prémisse `Fa` par ∀I ?","choices":["Parce que a apparaît dans une prémisse : il n'est pas arbitraire","Parce que ∀I demande une sous-preuve","On le peut"],"answer":0,"explanation":"Que Socrate soit sage ne prouve pas que tout le monde l'est."},{"id":"c5-24","type":"proof","premises":["∃x(Fx ∧ Gx)"],"conclusion":"∃x Fx","solution":[{"d":1,"f":"Fa ∧ Ga","r":"Hyp"},{"d":1,"f":"Fa","r":"∧E","c":"2"},{"d":1,"f":"∃x Fx","r":"∃I","c":"3"},{"d":0,"f":"∃x Fx","r":"∃E","c":"1, 2-4"}]},{"id":"c5-25","type":"proof","justifyOnly":true,"premises":["∃x Fx","∀x(Fx → Gx)"],"conclusion":"∃x Gx","given":[{"d":1,"f":"Fa"},{"d":1,"f":"Fa → Ga"},{"d":1,"f":"Ga"},{"d":1,"f":"∃x Gx"},{"d":0,"f":"∃x Gx"}],"solution":[{"d":1,"f":"Fa","r":"Hyp"},{"d":1,"f":"Fa → Ga","r":"∀E","c":"2"},{"d":1,"f":"Ga","r":"→E","c":"4, 3"},{"d":1,"f":"∃x Gx","r":"∃I","c":"5"},{"d":0,"f":"∃x Gx","r":"∃E","c":"1, 3-6"}]},{"id":"c5-26","type":"mcq","prompt":"Dans ∃E, pourquoi le nom de l'hypothèse doit-il être nouveau ?","choices":["On ne sait rien de l'objet qui existe : il ne faut pas le confondre avec un objet déjà nommé","Pour que la preuve soit plus courte","Ce n'est pas obligatoire"],"answer":0},{"id":"c5-27","type":"proof","premises":["¬∃x Fx"],"conclusion":"∀x¬Fx","solution":[{"d":0,"f":"∀x¬Fx","r":"CQ","c":"1"}]},{"id":"c5-28","type":"proof","premises":["∀x(Fx → Gx)","∀x(Gx → Hx)"],"conclusion":"∀x(Fx → Hx)","solution":[{"d":0,"f":"Fa → Ga","r":"∀E","c":"1"},{"d":0,"f":"Ga → Ha","r":"∀E","c":"2"},{"d":1,"f":"Fa","r":"Hyp"},{"d":1,"f":"Ga","r":"→E","c":"3, 5"},{"d":1,"f":"Ha","r":"→E","c":"4, 6"},{"d":0,"f":"Fa → Ha","r":"→I","c":"5-7"},{"d":0,"f":"∀x(Fx → Hx)","r":"∀I","c":"8"}],"explanation":"C'est le syllogisme Barbara : tous les F sont G, tous les G sont H, donc tous les F sont H."}]}],"test":{"size":9,"exercises":[{"id":"c5-t1","type":"proof","premises":["∀x Fx ∨ ∀x Gx"],"conclusion":"∀x(Fx ∨ Gx)","solution":[{"d":1,"f":"∀x Fx","r":"Hyp"},{"d":1,"f":"Fa","r":"∀E","c":"2"},{"d":1,"f":"Fa ∨ Ga","r":"∨I","c":"3"},{"d":1,"f":"∀x(Fx ∨ Gx)","r":"∀I","c":"4"},{"d":1,"f":"∀x Gx","r":"Hyp"},{"d":1,"f":"Ga","r":"∀E","c":"6"},{"d":1,"f":"Fa ∨ Ga","r":"∨I","c":"7"},{"d":1,"f":"∀x(Fx ∨ Gx)","r":"∀I","c":"8"},{"d":0,"f":"∀x(Fx ∨ Gx)","r":"∨E","c":"1, 2-5, 6-9"}]},{"id":"c5-t2","type":"buildmodel","prompt":"« Tous les F sont G ; quelque chose est G ; donc quelque chose est F. » Construis un contre-modèle.","true":["∀x(Fx → Gx)","∃x Gx"],"false":["∃x Fx"]}]}},"logique/ch6":{"id":"ch6","title":"Logique modale","summary":"Nécessité et possibilité, mondes possibles, systèmes K, T, S4, S5.","symbols":["¬","∧","∨","→","↔","□","◇","(",")"],"lessons":[{"id":"l1","title":"Nécessaire et possible","cours":[{"title":"Deux nouveaux opérateurs","body":"- `□p` : « il est **nécessaire** que p », « nécessairement p ».\n- `◇p` : « il est **possible** que p », « possiblement p ».\n\nCe sont des opérateurs, comme ¬ : ils s'appliquent à une formule. `□(p → q)` (« nécessairement, si p alors q ») n'est pas `p → □q` (« si p, alors nécessairement q »).","examples":[{"text":"Il est possible qu'il pleuve.","formula":"◇p"},{"text":"Il est impossible que le triangle ait quatre côtés.","formula":"¬◇q","note":"ou, de façon équivalente, □¬q"}]},{"title":"La dualité","body":"□ et ◇ se définissent l'un par l'autre :\n- `◇p ≡ ¬□¬p` : « possible » = « pas nécessairement faux » ;\n- `□p ≡ ¬◇¬p` : « nécessaire » = « impossible que ce soit faux ».\n\nUne proposition est **contingente** si elle est possible et que sa négation l'est aussi : `◇p ∧ ◇¬p`."}],"exercises":[{"id":"c6-1","type":"formalize","sentence":"Il est possible que Socrate soit sage.","legend":{"s":"Socrate est sage"},"answer":"◇s"},{"id":"c6-2","type":"formalize","sentence":"Il est impossible que Dieu soit trompeur.","legend":{"t":"Dieu est trompeur"},"answer":"¬◇t","explanation":"□¬t est équivalent et accepté."},{"id":"c6-3","type":"mcq","prompt":"Quelle formule est équivalente à `◇p` ?","choices":["¬□¬p","□¬p","¬□p","□p"],"formulas":true,"answer":0},{"id":"c6-4","type":"formula","prompt":"Écris `□p` en utilisant ◇ mais pas □.","answer":"¬◇¬p","forbid":["□"]},{"id":"c6-5","type":"formalize","sentence":"Il est contingent que le monde existe.","legend":{"m":"le monde existe"},"answer":"◇m ∧ ◇¬m"},{"id":"c6-6","type":"formalize","sentence":"Nécessairement, si Socrate est un homme, il est mortel.","legend":{"h":"Socrate est un homme","m":"Socrate est mortel"},"answer":"□(h → m)","explanation":"La nécessité porte sur l'implication entière (necessitas consequentiae)."},{"id":"c6-7","type":"mcq","prompt":"« Si Socrate est assis, nécessairement il est assis. » Quelle formule correspond (a : Socrate est assis) ?","choices":["a → □a","□(a → a)","□a → a"],"formulas":true,"answer":0,"explanation":"Ici la nécessité porte sur le conséquent seul (necessitas consequentis) : c'est une thèse forte, et douteuse. □(a → a), elle, est trivialement vraie."},{"id":"c6-8","type":"formula","prompt":"Écris « il n'est pas nécessaire que p » sans mettre ¬ devant □ : utilise ◇.","answer":"◇¬p","forbid":["□"]}]},{"id":"l2","title":"Mondes possibles","cours":[{"title":"Modèles de Kripke","body":"Un **modèle de Kripke** comprend :\n- des **mondes possibles** (w1, w2…) ;\n- une relation d'**accessibilité** : quels mondes sont « possibles » du point de vue de chaque monde (les flèches) ;\n- pour chaque monde, les lettres qui y sont vraies.\n\nOn évalue une formule **à un monde** :\n- `□A` est vrai en w si A est vrai dans **tous** les mondes que w voit ;\n- `◇A` est vrai en w si A est vrai dans **au moins un** monde que w voit."},{"title":"Les cas limites","body":"Un monde qui ne voit **aucun** monde rend `□A` vrai (aucun contre-exemple accessible) et `◇A` faux (aucun monde où A est vrai).\n\nLe monde lui-même ne compte pour □ et ◇ que s'il se voit (flèche en boucle)."}],"exercises":[{"id":"c6-9","type":"kripketruth","model":{"worlds":["w1","w2","w3"],"access":[["w1","w2"],["w1","w3"]],"valuation":{"w1":[],"w2":["p"],"w3":["p","q"]}},"world":"w1","sentences":["□p","◇q","□q","p"]},{"id":"c6-10","type":"mcq","prompt":"Le monde w ne voit aucun monde. Que vaut `□p` en w ?","choices":["Vrai","Faux","Ça dépend de p en w"],"answer":0,"explanation":"Il n'y a aucun monde accessible où p serait faux : □p est vrai « à vide »."},{"id":"c6-11","type":"kripketruth","model":{"worlds":["w1","w2"],"access":[["w1","w1"],["w1","w2"],["w2","w2"]],"valuation":{"w1":["p"],"w2":["q"]}},"world":"w1","sentences":["◇p","□p","□(p ∨ q)","◇(p ∧ q)"]},{"id":"c6-12","type":"kripketruth","model":{"worlds":["w1","w2","w3"],"access":[["w1","w2"],["w2","w3"],["w3","w3"]],"valuation":{"w1":["p"],"w2":[],"w3":["p"]}},"world":"w1","sentences":["◇p","◇◇p","□◇p","◇□p"]},{"id":"c6-13","type":"mcq","prompt":"Pour que `◇p` soit vrai au monde w, il faut…","choices":["au moins un monde accessible depuis w où p est vrai","que p soit vrai en w","que p soit vrai dans tous les mondes"],"answer":0},{"id":"c6-14","type":"kripketruth","model":{"worlds":["w1","w2","w3"],"access":[["w1","w2"],["w2","w1"],["w2","w3"]],"valuation":{"w1":["p"],"w2":["p","q"],"w3":[]}},"world":"w2","sentences":["□p","◇¬p","□◇q","◇□⊥"]}]},{"id":"l3","title":"Contre-modèles","cours":[{"title":"Validité en logique modale","body":"Une formule modale est **valide** (dans le système de base **K**) si elle est vraie dans tous les mondes de tous les modèles de Kripke.\n\nPour montrer qu'elle ne l'est pas, on construit un **contre-modèle** : un monde w1 où elle est fausse.\n\nLa formule `□(p → q) → (□p → □q)`, appelée **axiome K**, est valide : si p → q et p sont vrais dans tous les mondes accessibles, q l'est aussi."},{"title":"Méthode","body":"- Pour rendre `□A` **faux** en w1 : il faut un monde accessible où A est faux.\n- Pour rendre `◇A` **faux** en w1 : A doit être faux dans tous les mondes accessibles (ou w1 ne voit rien).\n- Pour rendre `□A` **vrai** : A vrai partout où w1 regarde.\n\nDans l'exercice, coche les flèches dans la grille (la ligne voit la colonne) et choisis où chaque lettre est vraie ; le graphe et les conditions se mettent à jour en direct."}],"exercises":[{"id":"c6-15","type":"kripkebuild","prompt":"Montre que `□p → p` n'est pas valide dans K : rends-la fausse en w1.","true":[],"false":["□p → p"],"explanation":"Il suffit que p soit faux en w1 et que w1 ne voie pas lui-même (ou ne voie que des mondes où p est vrai)."},{"id":"c6-16","type":"kripkebuild","prompt":"Construis un modèle où, en w1, p est possible mais pas nécessaire.","true":["◇p"],"false":["□p"]},{"id":"c6-17","type":"kripkebuild","prompt":"Montre que `◇p ∧ ◇q` n'implique pas `◇(p ∧ q)`.","true":["◇p ∧ ◇q"],"false":["◇(p ∧ q)"]},{"id":"c6-18","type":"mcq","prompt":"Laquelle de ces formules est valide dans K, sans condition sur l'accessibilité ?","choices":["□(p → q) → (□p → □q)","□p → p","◇p → □p"],"formulas":true,"answer":0,"explanation":"C'est l'axiome K, valide dans tous les modèles."},{"id":"c6-19","type":"kripkebuild","prompt":"Montre que `□(p ∨ q) → (□p ∨ □q)` n'est pas valide.","true":[],"false":["□(p ∨ q) → (□p ∨ □q)"],"explanation":"Il faut deux mondes accessibles : l'un où seul p est vrai, l'autre où seul q l'est."},{"id":"c6-20","type":"kripkebuild","prompt":"Construis un modèle où, en w1, `□p` est vrai mais `◇p` est faux.","true":["□p"],"false":["◇p"],"explanation":"Seul un monde qui ne voit rien rend □p vrai et ◇p faux."},{"id":"c6-21","type":"mcq","prompt":"Pour rendre `□A` faux au monde w1, il faut…","choices":["un monde accessible depuis w1 où A est faux","que A soit faux en w1","que w1 ne voie aucun monde"],"answer":0}]},{"id":"l4","title":"Systèmes K, T, S4, S5","cours":[{"title":"Axiomes et propriétés de l'accessibilité","body":"En imposant des propriétés à l'accessibilité, on rend valides de nouveaux axiomes :\n- **T** : `□p → p` — relation **réflexive** (chaque monde se voit) ;\n- **D** : `□p → ◇p` — relation **sérielle** (chaque monde voit au moins un monde) ;\n- **4** : `□p → □□p` — relation **transitive** ;\n- **B** : `p → □◇p` — relation **symétrique** ;\n- **5** : `◇p → □◇p` — relation **euclidienne** ; avec la réflexivité, elle devient une relation d'équivalence."},{"title":"Les systèmes usuels","body":"- **K** : aucune condition (axiome K seul).\n- **T** = K + T : réflexive.\n- **S4** = T + 4 : réflexive et transitive.\n- **S5** = T + 5 : réflexive, symétrique et transitive (tous les mondes d'un groupe se voient).\n\nChaque système contient le précédent : tout ce qui est valide dans K l'est dans T, tout ce qui est valide dans T l'est dans S4, et S4 est contenu dans S5. Pour la nécessité « métaphysique », on retient souvent S5 ; pour la nécessité morale (le devoir), plutôt D : ce qui est obligatoire n'est pas forcément réalisé."}],"exercises":[{"id":"c6-22","type":"mcq","prompt":"Quelle propriété de l'accessibilité rend valide `□p → p` ?","choices":["La réflexivité","La symétrie","La transitivité"],"answer":0},{"id":"c6-23","type":"mcq","prompt":"Quel axiome correspond à la transitivité ?","choices":["□p → □□p","p → □◇p","□p → ◇p"],"formulas":true,"answer":0},{"id":"c6-24","type":"kripkebuild","prompt":"Montre que `□p → □□p` n'est pas valide dans T : construis un modèle **réflexif** où elle est fausse en w1.","system":"T","true":[],"false":["□p → □□p"],"explanation":"Il faut une chaîne w1 → w2 → w3 sans flèche directe w1 → w3, avec p faux en w3."},{"id":"c6-25","type":"mcq","promp
